name: MIR 2027 quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          for file in docs/*.js; do node --check "$file"; done
      - name: Check learning and persistence behavior
        run: node --test tests/*.test.cjs
      - name: Check protected content is absent
        run: |
          test ! -e "979623535-LIBRO-GORDO-MIR-2016-2025.pdf"
          ! find . -type f \( -name '*.pdf' -o -name '*banco_personal*' \) | grep -q .
